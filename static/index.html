<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cullen - Media Culling Tool</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 20px; }
    a { color: #0066cc; cursor: pointer; text-decoration: none; }
    a:hover { color: #0047b3; }
    #nav { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #nav button.active { background: #0066cc; color: #fff; border: 1px solid #0047b3; }
    #list div { padding: 4px 0; }
    .unsupported { color: #888; }
    #viewer { position: fixed; inset: 0; background: #111; color: #eee; display: none; flex-direction: column; z-index: 10; }
    #viewer.open { display: flex; }
    #title { padding: 10px 16px; font-size: 14px; display: flex; justify-content: space-between; }
    #stage { touch-action: none; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
    #stage img, #stage video { max-width: 100%; max-height: 100%; }
    #stage audio { width: 80%; }
    #actions { display: flex; gap: 20px; padding: 16px; justify-content: center; }
    #actions button { flex: 1; max-width: 300px; padding: 18px; font-size: 20px; font-weight: bold; border: 0; border-radius: 6px; color: #fff; cursor: pointer; }
    #keep { background: #2e8b57; }
    #discard { background: #c0392b; }
    #actions button:disabled { opacity: .5; cursor: wait; }
    #close { background: none; border: 0; color: #eee; font-size: 14px; cursor: pointer; }
    @media (orientation: portrait), (max-width: 700px) {
      body { padding: 12px; font-size: max(18px, 4.5vw); }
      h1 { font-size: max(28px, 7vw); margin: 0 0 .4em; }
      #nav { font-size: max(18px, 4.5vw); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      #nav button { font-size: inherit; padding: .4em .9em; }
      #viewer { height: 100dvh; }
      #title { font-size: max(16px, 4vw); padding: 10px 12px; gap: 10px; }
      #close { font-size: inherit; padding: 8px; }
      #stage { padding: 0; }
      #actions { gap: 0; padding: 0; padding-bottom: env(safe-area-inset-bottom); }
      #actions button { max-width: none; height: 11vh; min-height: 55px; border-radius: 0; font-size: 28px; }
      #list div { padding: .55em 0; font-size: max(20px, 5vw); border-bottom: 1px solid #eee; overflow-wrap: anywhere; }
      #list a { display: block; }
    }
  </style>
</head>
<body>
  <h1>Cullen</h1>
  <div id="nav"></div>
  <hr>
  <div id="list"></div>

  <div id="viewer">
    <div id="title"><span id="name"></span><button id="close">Close (Esc)</button></div>
    <div id="stage"></div>
    <div id="actions">
      <button id="discard">Discard</button>
      <button id="keep">Keep</button>
    </div>
  </div>

  <script>
    // The page is served from <baseURL>/, so relative URLs resolve under it.
    let currentPath = '';
    let files = [];   // supported media in current directory
    let index = -1;
    let busy = false;
    const $ = (id) => document.getElementById(id);

    function mediaURL(p) {
      return 'media/' + p.split('/').map(encodeURIComponent).join('/');
    }

    let entries = []; // raw listing of the current directory
    let sortBy = localStorage.getItem('cullen.sortBy') === 'name' ? 'name' : 'modified';
    let sortDir = localStorage.getItem('cullen.sortDir') === 'asc' ? 'asc' : 'desc';

    function sorted(data) {
      const dir = sortDir === 'asc' ? 1 : -1;
      const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
      return [...data].sort((a, b) => {
        if (a.is_dir !== b.is_dir) return a.is_dir ? -1 : 1;
        const c = sortBy === 'modified' ? (a.modified - b.modified) || byName(a, b) : byName(a, b);
        return c * dir;
      });
    }

    // The current folder lives in the URL hash (#/a/b) so it can be deep linked.
    function pathToHash(p) {
      return p ? '#/' + p.split('/').map(encodeURIComponent).join('/') : '#/';
    }

    function hashToPath() {
      try {
        return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent).join('/');
      } catch (e) {
        return '';
      }
    }

    async function load(path) {
      const res = await fetch('api/list?path=' + encodeURIComponent(path));
      if (!res.ok) return false;
      entries = await res.json();
      currentPath = path;
      render();
      return true;
    }

    // User-initiated navigation: adds a history entry.
    async function list(path = '') {
      if (!await load(path)) { alert('Cannot open folder: /' + path); return; }
      if (location.hash !== pathToHash(path)) history.pushState(null, '', pathToHash(path));
    }

    // URL-driven navigation (initial load, back/forward, edited hash).
    async function loadFromURL() {
      const path = hashToPath();
      if (await load(path)) return;
      await load('');
      history.replaceState(null, '', pathToHash(''));
    }

    function setSort(by, dir) {
      sortBy = by; sortDir = dir;
      localStorage.setItem('cullen.sortBy', by);
      localStorage.setItem('cullen.sortDir', dir);
      render();
    }

    function render() {
      const data = sorted(entries);
      files = data.filter(f => !f.is_dir && f.type); // culling follows this order
      const path = currentPath;

      const nav = $('nav');
      nav.replaceChildren();
      const strong = document.createElement('strong');
      strong.textContent = '/' + path;
      nav.append(strong);
      if (path) {
        const up = document.createElement('button');
        up.textContent = 'Up';
        up.onclick = () => list(path.split('/').slice(0, -1).join('/'));
        nav.append(up);
      }
      for (const [v, t] of [['modified', 'Modified'], ['name', 'Name']]) {
        const btn = document.createElement('button');
        const active = v === sortBy;
        btn.textContent = t + (active ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '');
        btn.title = active ? 'Toggle sort direction' : 'Sort by ' + t.toLowerCase();
        if (active) btn.className = 'active';
        btn.onclick = () => setSort(v, active && sortDir === 'desc' ? 'asc' : active ? 'desc' : sortDir);
        nav.append(btn);
      }

      const box = $('list');
      box.replaceChildren();
      const icons = { image: '🖼️', video: '🎬', audio: '🎵' };
      for (const f of data) {
        const row = document.createElement('div');
        if (f.is_dir) {
          const a = document.createElement('a');
          a.textContent = '📁 ' + f.name;
          a.onclick = () => list(f.rel_path);
          row.append(a);
        } else if (f.type) {
          const a = document.createElement('a');
          a.textContent = icons[f.type] + ' ' + f.name;
          a.onclick = () => cull(files.findIndex(x => x.rel_path === f.rel_path));
          row.append(a);
        } else {
          row.className = 'unsupported';
          row.textContent = f.name;
        }
        box.append(row);
      }
      if (!data.length) box.textContent = '(empty folder)';
    }

    // The viewer owns one history entry so the browser back button closes it.
    function hideViewer() {
      resetZoom();
      $('stage').replaceChildren(); // stops playback
      $('viewer').classList.remove('open');
      index = -1;
    }

    function closeViewer() {
      if (index < 0) return;
      if (history.state && history.state.viewer) history.back(); // popstate hides it
      else { hideViewer(); load(currentPath); }
    }

    window.addEventListener('popstate', () => {
      if (index >= 0) hideViewer();
      loadFromURL();
    });
    if (history.state && history.state.viewer) history.replaceState(null, '');

    function cull(i) {
      if (i < 0 || i >= files.length) { closeViewer(); return; }
      if (index < 0) history.pushState({ viewer: true }, '');
      index = i;
      resetZoom();
      const f = files[i];
      $('name').textContent = `${f.name}  (${i + 1} / ${files.length})`;
      let el;
      if (f.type === 'image') {
        el = document.createElement('img');
        el.alt = f.name;
      } else {
        el = document.createElement(f.type);
        el.controls = true;
        el.autoplay = true;
      }
      el.src = mediaURL(f.rel_path);
      $('stage').replaceChildren(el);
      $('viewer').classList.add('open');
    }

    function next() {
      if (busy || index < 0) return;
      cull(index + 1); // past the last file returns to the list
    }

    // Keep either just advances ("next") or moves the file away ("move"),
    // as configured by the server's --keep flag.
    let keepMode = 'next';

    async function keep() {
      if (busy || index < 0) return;
      if (keepMode !== 'move') { next(); return; }
      busy = true;
      $('keep').disabled = $('discard').disabled = true;
      try {
        const res = await fetch('api/keep', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: files[index].rel_path })
        });
        if (!res.ok) throw new Error(await res.text());
        files.splice(index, 1);
        busy = false;
        cull(index); // next file now occupies this index
      } catch (e) {
        alert('Keep failed: ' + e.message);
      } finally {
        busy = false;
        $('keep').disabled = $('discard').disabled = false;
      }
    }

    async function discard() {
      if (busy || index < 0) return;
      busy = true;
      $('keep').disabled = $('discard').disabled = true;
      const f = files[index];
      try {
        const res = await fetch('api/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: f.rel_path })
        });
        if (!res.ok) throw new Error(await res.text());
        files.splice(index, 1);
        cull(index); // next file now occupies this index
      } catch (e) {
        alert('Delete failed: ' + e.message);
      } finally {
        busy = false;
        $('keep').disabled = $('discard').disabled = false;
      }
    }

    $('keep').onclick = keep;
    $('discard').onclick = discard;
    $('close').onclick = closeViewer;
    function prev() {
      if (busy || index < 0) return;
      cull(index - 1); // past the first file returns to the list
    }

    // Touch: one finger swipes (left = next, right = previous, up = list) at 1x
    // zoom or pans when zoomed; two fingers pinch-zoom around their midpoint.
    const SWIPE_MIN = 50, MIN_ZOOM = 0.25, MAX_ZOOM = 20; // 1x = fitted to the screen
    let touch = null, pan = null, pinch = null;
    let zoom = { s: 1, x: 0, y: 0 };
    const stage = $('stage');

    function zoomTarget() {
      const el = stage.firstElementChild;
      return el && el.tagName !== 'AUDIO' ? el : null;
    }

    function applyZoom() {
      const el = zoomTarget();
      if (!el) return;
      const { s } = zoom;
      // Keep the scaled media covering the stage; center it where it is smaller.
      const mx = Math.max(0, (el.offsetWidth * s - stage.clientWidth) / 2);
      const my = Math.max(0, (el.offsetHeight * s - stage.clientHeight) / 2);
      zoom.x = Math.min(mx, Math.max(-mx, zoom.x));
      zoom.y = Math.min(my, Math.max(-my, zoom.y));
      el.style.transformOrigin = 'center';
      el.style.transform = s === 1 ? '' : `translate(${zoom.x}px, ${zoom.y}px) scale(${s})`;
    }

    function resetZoom() {
      zoom = { s: 1, x: 0, y: 0 };
      touch = pan = pinch = mousePan = null;
      stage.style.cursor = '';
    }

    // Offsets are relative to the stage center, which is the scale origin.
    function pinchState(e) {
      const [a, b] = [e.touches[0], e.touches[1]];
      const r = stage.getBoundingClientRect();
      return {
        d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
        cx: (a.clientX + b.clientX) / 2 - (r.left + r.width / 2),
        cy: (a.clientY + b.clientY) / 2 - (r.top + r.height / 2),
      };
    }

    stage.addEventListener('touchstart', (e) => {
      touch = pan = null;
      if (index < 0) return;
      if (e.touches.length === 2) {
        if (!zoomTarget()) return;
        const p = pinchState(e);
        pinch = { ...p, s0: zoom.s, x0: zoom.x, y0: zoom.y };
        return;
      }
      if (e.touches.length !== 1 || pinch) return;
      const t = e.touches[0];
      const m = e.target;
      // Leave the bottom strip of audio/video alone so the seek bar still works.
      if ((m.tagName === 'VIDEO' || m.tagName === 'AUDIO') &&
          t.clientY > m.getBoundingClientRect().bottom - 80) return;
      if (zoom.s > 1) pan = { x: t.clientX, y: t.clientY, x0: zoom.x, y0: zoom.y };
      else touch = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (pinch && e.touches.length === 2) {
        const p = pinchState(e);
        const s = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, pinch.s0 * p.d / pinch.d));
        // Keep the content point under the initial midpoint under the current one.
        const k = s / pinch.s0;
        zoom = { s, x: p.cx - (pinch.cx - pinch.x0) * k, y: p.cy - (pinch.cy - pinch.y0) * k };
        applyZoom();
      } else if (pan && e.touches.length === 1) {
        const t = e.touches[0];
        zoom.x = pan.x0 + t.clientX - pan.x;
        zoom.y = pan.y0 + t.clientY - pan.y;
        applyZoom();
      }
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      if (pinch) {
        if (e.touches.length < 2) {
          pinch = null;
          if (Math.abs(zoom.s - 1) < 0.02) zoom = { s: 1, x: 0, y: 0 };
          applyZoom();
          // Continue as a pan with the finger that is still down.
          if (e.touches.length === 1 && zoom.s > 1) {
            const t = e.touches[0];
            pan = { x: t.clientX, y: t.clientY, x0: zoom.x, y0: zoom.y };
          }
        }
        return;
      }
      if (pan) { if (e.touches.length === 0) pan = null; return; }
      if (!touch || index < 0) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
      touch = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) next(); else prev();
      } else if (dy < 0) {
        closeViewer();
      }
    }, { passive: true });

    stage.addEventListener('touchcancel', () => { touch = pan = pinch = null; }, { passive: true });

    // Mouse: wheel zooms around the cursor, middle-button drag pans.
    stage.addEventListener('wheel', (e) => {
      if (index < 0 || !zoomTarget()) return;
      e.preventDefault();
      const r = stage.getBoundingClientRect();
      const px = e.clientX - (r.left + r.width / 2);
      const py = e.clientY - (r.top + r.height / 2);
      const s = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom.s * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015))));
      const k = s / zoom.s;
      zoom = Math.abs(s - 1) < 0.02 ? { s: 1, x: 0, y: 0 } : { s, x: px - (px - zoom.x) * k, y: py - (py - zoom.y) * k };
      applyZoom();
    }, { passive: false });

    let mousePan = null;
    stage.addEventListener('mousedown', (e) => {
      if (e.button !== 1 || index < 0) return;
      e.preventDefault(); // no browser autoscroll
      mousePan = { x: e.clientX, y: e.clientY, x0: zoom.x, y0: zoom.y };
      stage.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
      if (!mousePan) return;
      zoom.x = mousePan.x0 + e.clientX - mousePan.x;
      zoom.y = mousePan.y0 + e.clientY - mousePan.y;
      applyZoom();
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button !== 1 || !mousePan) return;
      mousePan = null;
      stage.style.cursor = '';
    });
    stage.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });

    document.addEventListener('keydown', (e) => {
      if (index < 0) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') prev();
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'Delete') discard();
    });

    fetch('api/config').then(r => r.json()).then(c => { keepMode = c.keep; }).catch(() => {})
      .finally(loadFromURL);
  </script>
</body>
</html>
